/* Consola de operacion: pestañas arriba, lista de clientes y ficha del cliente abajo (una columna en el celu) */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --sunk: #E9ECE7;
  --ink: #131A24;
  --muted: #586170;
  --line: #D4D9D2;
  --brand: #16243A;
  --brand-ink: #FFFFFF;
  --signal: #E9A80C;
  --signal-ink: #1B1405;
  --verde: #2F7D4F;
  --gris: #8A8F96;
  --ok: #1F7A4D;
  --bad: #B3412E;
  --warn: #B26B00;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #161D28; --sunk: #1C2533; --ink: #E7EBF0; --muted: #9AA5B4; --line: #2A3444;
    --brand: #E7EBF0; --brand-ink: #0E131B; --signal: #F2B82E; --verde: #5CC28A; --gris: #7D8693;
    --ok: #4FC08A; --bad: #E37761; --warn: #E5A04A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #161D28; --sunk: #1C2533; --ink: #E7EBF0; --muted: #9AA5B4; --line: #2A3444;
  --brand: #E7EBF0; --brand-ink: #0E131B; --signal: #F2B82E; --verde: #5CC28A; --gris: #7D8693;
  --ok: #4FC08A; --bad: #E37761; --warn: #E5A04A; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; }
.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.35rem; font-weight: 800; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
button { font: inherit; }
a { color: var(--brand); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 12px; }
.logo { font: 800 1.7rem/1 var(--font-display); letter-spacing: 0.04em; color: var(--brand); display: inline-flex; align-items: center; gap: 8px; }
.logo i { width: 12px; height: 12px; background: var(--verde); display: inline-block; }
.sub { font: 500 0.72rem/1.2 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.estado { font: 400 0.75rem/1.3 var(--font-data); color: var(--muted); }
.estado[data-k="ok"] { color: var(--ok); }
.estado[data-k="error"], .estado[data-k="local"], .estado[data-k="lectura"], .estado[data-k="lejos"] { color: var(--bad); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); padding-bottom: 0; }
.tabs button { border: 0; background: none; color: var(--muted); padding: 10px 12px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--signal); }
.cuerpo { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.cuerpo.una { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 820px) { .cuerpo { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.lista { display: grid; gap: 4px; }
.item { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 2px 10px; align-items: center; width: 100%; text-align: left; padding: 8px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink); cursor: pointer; }
.item[aria-current="true"] { background: var(--sunk); border-color: var(--line); }
.item .pt { grid-row: span 2; width: 10px; height: 10px; border-radius: 50%; background: var(--gris); }
.item .pt.Activo { background: var(--ok); } .item .pt.Piloto { background: var(--signal); }
.item strong { font-weight: 600; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item span.c { font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 12px; min-height: 38px; cursor: pointer; font-weight: 500; font-size: 0.88rem; }
.btn.pri { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.senal { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); font-weight: 600; }
.btn.peligro { color: var(--bad); }
.fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.campo { display: grid; gap: 4px; min-width: 0; }
.campo span { font: 500 0.68rem/1.2 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
input, select, textarea { font: 400 0.95rem/1.3 var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; width: 100%; min-width: 0; }
input.n { font-family: var(--font-data); text-align: right; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--ok); }
.ayuda { color: var(--muted); font-size: 0.88rem; max-width: 72ch; }
.chip { font: 500 0.7rem/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; padding: 5px 8px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi.ancho { grid-column: 1 / -1; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); display: grid; gap: 2px; }
.kpi span { font: 500 0.66rem/1.2 var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.kpi strong { font: 500 clamp(1.05rem, 4.2vw, 1.3rem)/1.2 var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi em { font-style: normal; font-size: 0.78rem; color: var(--muted); }
.kpi.bien strong { color: var(--ok); } .kpi.mal strong { color: var(--bad); }
.tabla-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font: 500 0.68rem/1.2 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
td.r, th.r { text-align: right; }
table.suelta td { white-space: normal; }
td input, td select { padding: 5px 6px; min-width: 90px; }
td select { min-width: 118px; }
td input.n { width: 96px; }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 2px 6px; }
.check { display: grid; gap: 8px; }
.ck { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
@media (max-width: 620px) { .ck { grid-template-columns: 26px minmax(0, 1fr); } .ck > :nth-child(3) { grid-column: 2; } }
.ck .t { font-weight: 600; font-size: 0.92rem; }
.ck .d { font-size: 0.8rem; color: var(--muted); }
.ck .estado-ck { font: 600 0.72rem/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.06em; }
.ck.ok .estado-ck { color: var(--ok); } .ck.no .estado-ck { color: var(--bad); }
.alertas { display: grid; gap: 6px; }
.alerta { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-left: 4px solid var(--warn); background: var(--surface); border-radius: 6px; font-size: 0.9rem; }
.alerta.roja { border-left-color: var(--bad); }
.grafico { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.grafico svg { display: block; width: 100%; height: auto; max-width: 100%; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 720px) { .dos { grid-template-columns: 1fr; } }
.hoja { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
.hoja svg { display: block; width: 100%; height: auto; }
.confirma { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.88rem; }
.texto { display: grid; gap: 10px; max-width: 72ch; }
.texto ol, .texto ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; }
.res { display: grid; gap: 6px; }
.res .ln { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; font-size: 0.92rem; }
.res .ln .num { white-space: nowrap; }
.res .ln.tot { border-bottom: 0; font-weight: 700; font-size: 1rem; }

<div class="app">
  <header class="top">
    <div class="marca"><span class="logo" aria-label="Dumme"><i></i>DUMME</span><span class="sub">Residuos industriales</span></div>
    <span class="estado" id="estado" role="status">Cargando…</span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" id="t-panel" data-tab="panel" aria-selected="true">Panel</button>
    <button role="tab" id="t-clientes" data-tab="clientes" aria-selected="false">Clientes</button>
    <button role="tab" id="t-prov" data-tab="proveedores" aria-selected="false">Proveedores</button>
    <button role="tab" id="t-rutas" data-tab="rutas" aria-selected="false">Rutas y acopio</button>
    <button role="tab" id="t-coti" data-tab="cotizador" aria-selected="false">Cotizador</button>
    <button role="tab" id="t-como" data-tab="como" aria-selected="false">Cómo funciona</button>
  </nav>
  <div id="vista"></div>
</div>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const fmt = (n, d) => (isFinite(n) ? Number(n) : 0).toLocaleString('es-AR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  const pesos = n => (n < 0 ? '−$' : '$') + fmt(Math.abs(n), 0);
  const nid = p => p + Date.now().toString(36) + Math.floor(Math.random() * 1e5).toString(36);
  const clon = o => JSON.parse(JSON.stringify(o));
  const hoy = () => new Date().toISOString().slice(0, 10);
  const mesDe = f => (f || '').slice(0, 7);
  const masDias = (f, d) => { const x = new Date((f || hoy()) + 'T12:00:00'); x.setDate(x.getDate() + d); return x.toISOString().slice(0, 10); };
  const masAnios = (f, a) => { const x = new Date(f + 'T12:00:00'); x.setFullYear(x.getFullYear() + a); return x.toISOString().slice(0, 10); };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function el(tag, a, hijos) {
    const n = document.createElement(tag);
    Object.entries(a || {}).forEach(([k, v]) => {
      if (v === null || v === undefined || v === false) return;
      if (k === 'texto') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
    });
    (hijos || []).forEach(h => h && n.appendChild(typeof h === 'string' ? document.createTextNode(h) : h));
    return n;
  }
  const btn = (t, fn, c) => el('button', { type: 'button', class: 'btn ' + (c || ''), texto: t, onclick: fn });
  const campo = (et, inp) => el('label', { class: 'campo' }, [el('span', { texto: et }), inp]);
  const numIn = (id, v, fn, paso) => el('input', { id, class: 'n', type: 'number', inputmode: 'decimal', step: paso || 'any', value: v === null || v === undefined || v === '' ? '' : v, onchange: e => { const x = parseFloat(String(e.target.value).replace(',', '.')); fn(isFinite(x) ? x : null); } });
  const txtIn = (id, v, fn, ph) => el('input', { id, type: 'text', value: v || '', placeholder: ph || '', onchange: e => fn(e.target.value.trim()) });
  const fechaIn = (id, v, fn) => el('input', { id, type: 'date', value: v || '', onchange: e => fn(e.target.value) });
  const selIn = (id, v, ops, fn) => { const s = el('select', { id, onchange: e => fn(e.target.value) }); ops.forEach(o => { const [val, t] = Array.isArray(o) ? o : [o, o]; const op = el('option', { value: val, texto: t }); if (val === v) op.selected = true; s.appendChild(op); }); return s; };
  const SVGNS = 'http://www.w3.org/2000/svg';

  const TIPOS = ['Cartón y papel', 'Plástico', 'Metal y scrap', 'Madera y pallets', 'Vidrio', 'Orgánico', 'Textil', 'Mezcla no recuperable'];
  const COLOR_T = { 'Cartón y papel': '#B88A4A', 'Plástico': '#2D6CB5', 'Metal y scrap': '#6B7480', 'Madera y pallets': '#8A5A2B', 'Vidrio': '#3E9C8F', 'Orgánico': '#5E9156', 'Textil': '#8A6BB8', 'Mezcla no recuperable': '#A3473A' };
  const ESTADOS_C = ['Prospecto', 'Piloto', 'Activo', 'Baja'];

  // ---------------------------------------------------------------- estado y guardado
  let gens = {}, provs = {}, conf = { coti: null };
  let tab = 'panel', actual = null;
  let db = null, cols = {}, dbListo = false, soloLectura = false;
  const pend = {}, cola = {};
  const EST = { ok: 'Guardado', pend: 'Sin guardar…', guard: 'Guardando…', local: 'Esta vista no guarda: los cambios se pierden al salir', error: 'No se pudo guardar', lectura: 'Solo lectura', carga: 'Cargando…', lejos: 'No se pudo leer lo guardado' };
  const estado = k => { const e = $('#estado'); e.textContent = EST[k] || k; e.dataset.k = k; };
  const fuente = c => c === 'generadores' ? gens : c === 'proveedores' ? provs : conf;
  function guardar(c, id) {
    if (soloLectura) { estado('lectura'); return; }
    if (dbListo && !db) { estado('local'); return; }
    estado('pend');
    const k = c + '/' + id;
    clearTimeout(pend[k]);
    pend[k] = setTimeout(() => escribir(c, id), 900);
  }
  function escribir(c, id) {
    const k = c + '/' + id; delete pend[k];
    if (!db) return;
    cola[k] = (cola[k] || Promise.resolve()).then(async () => {
      const d = fuente(c)[id];
      estado('guard');
      try {
        if (d === undefined) await db.collection(c).doc(id).delete();
        else await db.collection(c).doc(id).set(clon(d));
        if (!Object.keys(pend).length) estado('ok');
      } catch (err) {
        if (err && (err.code === 'invalid_argument' || err.code === 'not_granted' || err.code === 'revoked')) { soloLectura = true; estado('lectura'); }
        else estado('error');
      }
    });
  }

  // ---------------------------------------------------------------- calculos
  const kgValorizable = g => (g.residuos || []).filter(r => r.destino === 'Valorización').reduce((a, r) => a + (r.kgMes || 0), 0);
  const kgMes = g => (g.residuos || []).reduce((a, r) => a + (r.kgMes || 0), 0);
  const retirosMes = (g, m) => (g.retiros || []).filter(r => mesDe(r.fecha) === m);
  function cumplimiento(g) {
    const inscr = !!(g.cumpl && g.cumpl.inscripto);
    const ddjj = g.cumpl && g.cumpl.ddjj ? masAnios(g.cumpl.ddjj, 1) : null;
    const ddjjOk = !!ddjj && ddjj >= hoy();
    const transp = !!(g.cumpl && g.cumpl.transportista && provs[g.cumpl.transportista]);
    const tp = transp ? provs[g.cumpl.transportista] : null;
    const habOk = !!tp && (!tp.vence || tp.vence >= hoy());
    const sinCert = (g.retiros || []).filter(r => !r.certificado).length;
    const invOk = (g.residuos || []).length > 0;
    return [
      { id: 'inscripto', t: 'Inscripto en el Registro Provincial de Generadores de Residuos No Especiales', d: inscr ? 'N° ' + (g.cumpl.nroInscripcion || '—') : 'Falta inscribir', ok: inscr, edit: 'inscripto' },
      { id: 'ddjj', t: 'Declaración jurada anual presentada', d: g.cumpl && g.cumpl.ddjj ? 'Presentada el ' + g.cumpl.ddjj + ' · vence ' + ddjj : 'Sin presentar', ok: ddjjOk, edit: 'ddjj' },
      { id: 'transp', t: 'Transportista habilitado asignado', d: tp ? tp.nombre + (tp.vence ? ' · habilitación vence ' + tp.vence : '') : 'Sin asignar', ok: transp && habOk, edit: 'transp' },
      { id: 'cert', t: 'Certificados de tratamiento, valorización o disposición archivados', d: (g.retiros || []).length ? (sinCert ? sinCert + ' retiro' + (sinCert > 1 ? 's' : '') + ' sin certificado' : 'Todos los retiros con certificado') : 'Sin retiros todavía', ok: (g.retiros || []).length > 0 && !sinCert },
      { id: 'inv', t: 'Residuos clasificados por tipo', d: invOk ? (g.residuos.length + ' tipos · ' + fmt(kgMes(g)) + ' kg/mes') : 'Falta el inventario', ok: invOk },
    ];
  }
  function alertas() {
    const out = [];
    Object.entries(gens).forEach(([id, g]) => {
      if (g.estado === 'Baja' || g.estado === 'Prospecto') return;
      cumplimiento(g).forEach(c => { if (!c.ok) out.push({ roja: c.id === 'transp' || c.id === 'ddjj', texto: g.nombre + ': ' + c.t.toLowerCase() + ' — ' + c.d, id }); });
      if (g.cumpl && g.cumpl.ddjj) { const v = masAnios(g.cumpl.ddjj, 1); if (v >= hoy() && v <= masDias(hoy(), 45)) out.push({ texto: g.nombre + ': la declaración jurada vence el ' + v, id }); }
    });
    Object.values(provs).forEach(p => { if (p.vence && p.vence < hoy()) out.push({ roja: true, texto: p.nombre + ': habilitación vencida el ' + p.vence }); else if (p.vence && p.vence <= masDias(hoy(), 45)) out.push({ texto: p.nombre + ': la habilitación vence el ' + p.vence }); });
    return out;
  }

  // ---------------------------------------------------------------- pestañas
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; pintar(); }));
  function pintar() {
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    const v = $('#vista'); v.textContent = '';
    ({ panel: vPanel, clientes: vClientes, proveedores: vProv, rutas: vRutas, cotizador: vCoti, como: vComo })[tab](v);
  }

  // ---------------------------------------------------------------- panel
  function vPanel(v) {
    const m = hoy().slice(0, 7);
    const act = Object.values(gens).filter(g => g.estado === 'Activo' || g.estado === 'Piloto');
    let kg = 0, kgVal = 0, neto = 0;
    act.forEach(g => retirosMes(g, m).forEach(r => { kg += r.kg || 0; if (r.destino === 'Valorización') kgVal += r.kg || 0; neto += r.monto || 0; }));
    const abonos = act.reduce((a, g) => a + (g.abono || 0), 0);
    const al = alertas();
    const kp = (t, val, s, c) => el('div', { class: 'kpi ' + (c || '') }, [el('span', { texto: t }), el('strong', { texto: val }), s ? el('em', { texto: s }) : null]);
    const sinDatos = !Object.keys(gens).length;
    v.appendChild(el('div', { class: 'panel' }, [
      el('div', { class: 'fila', style: 'justify-content:space-between' }, [el('h2', { texto: 'Panel del mes' }), el('span', { class: 'chip', texto: m })]),
      sinDatos ? el('div', { class: 'texto' }, [el('p', { class: 'ayuda', texto: 'Todavía no hay clientes. Cargá el primero en la pestaña Clientes, o cargá ejemplos para ver cómo queda.' }), el('div', { class: 'fila' }, [btn('+ Primer cliente', () => { tab = 'clientes'; nuevoCliente(); }, 'pri'), btn('Cargar ejemplos', cargarEjemplos)])]) : null,
      el('div', { class: 'kpis' }, [
        kp('Clientes activos', String(act.length), 'incluye pilotos'),
        kp('Abonos del mes', pesos(abonos), 'lo que cobrás fijo'),
        kp('Kg gestionados', fmt(kg), 'retiros de ' + m),
        kp('Valorizado', kg ? fmt(kgVal / kg * 100) + '%' : '—', 'kg que no fueron a disposición', kg && kgVal / kg >= 0.5 ? 'bien' : ''),
        kp('Resultado del mes', pesos(abonos + neto), 'abonos + valorización − costos de retiros', abonos + neto >= 0 ? 'bien' : 'mal'),
        kp('Alertas', String(al.length), al.length ? 'revisalas abajo' : 'todo en regla', al.length ? 'mal' : 'bien'),
      ]),
      el('h3', { texto: 'Kg por mes' }), el('div', { class: 'grafico' }, [graficoMeses(act)]),
      el('h3', { texto: 'Alertas de cumplimiento' }),
      el('div', { class: 'alertas' }, al.length ? al.map(a => el('div', { class: 'alerta' + (a.roja ? ' roja' : '') }, [el('span', { texto: a.texto }), a.id ? btn('Ver', () => { tab = 'clientes'; actual = a.id; pintar(); }) : null])) : [el('p', { class: 'ayuda', texto: 'Sin alertas.' })]),
    ]));
  }
  function graficoMeses(lista) {
    const meses = []; const d = new Date(); d.setDate(1);
    for (let i = 5; i >= 0; i--) { const x = new Date(d); x.setMonth(d.getMonth() - i); meses.push(x.toISOString().slice(0, 7)); }
    const val = meses.map(m => { let a = 0, b = 0; lista.forEach(g => retirosMes(g, m).forEach(r => { if (r.destino === 'Valorización') a += r.kg || 0; else b += r.kg || 0; })); return [a, b]; });
    const W = 460, H = 230, ml = 52, mb = 28, mt = 26, top = Math.max(1, ...val.map(x => x[0] + x[1]));
    const s = document.createElementNS(SVGNS, 'svg'); s.setAttribute('viewBox', `0 0 ${W} ${H}`); s.setAttribute('role', 'img'); s.setAttribute('aria-label', 'Kilos gestionados por mes, valorizados y a disposición');
    const add = (t, a, tx) => { const n = document.createElementNS(SVGNS, t); Object.entries(a).forEach(([k, v]) => n.setAttribute(k, v)); if (tx !== undefined) n.textContent = tx; s.appendChild(n); };
    add('rect', { width: W, height: H, fill: 'var(--surface)' });
    const paso = (() => { const v = top / 4, p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n > 5 ? 10 : n > 2 ? 5 : n > 1 ? 2 : 1) * p; })();
    const sy = v => H - mb - v / (paso * 4) * (H - mb - mt);
    for (let i = 0; i <= 4; i++) { add('line', { x1: ml, x2: W - 10, y1: sy(i * paso), y2: sy(i * paso), stroke: 'var(--line)' }); add('text', { x: ml - 8, y: sy(i * paso) + 4, 'text-anchor': 'end', 'font-size': 12, fill: 'var(--muted)', 'font-family': 'IBM Plex Mono, monospace' }, fmt(i * paso)); }
    const bw = (W - ml - 20) / meses.length;
    meses.forEach((m, i) => {
      const x = ml + i * bw + bw * 0.2, w = bw * 0.6, [a, b] = val[i];
      add('rect', { x, y: sy(a), width: w, height: H - mb - sy(a), fill: 'var(--verde)' });
      add('rect', { x, y: sy(a + b), width: w, height: sy(a) - sy(a + b), fill: 'var(--gris)' });
      add('text', { x: x + w / 2, y: H - 9, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--muted)', 'font-family': 'IBM Plex Mono, monospace' }, m.slice(5) + '/' + m.slice(2, 4));
    });
    add('rect', { x: ml, y: 6, width: 10, height: 10, fill: 'var(--verde)' }); add('text', { x: ml + 14, y: 15, 'font-size': 12, fill: 'var(--ink)' }, 'Valorizado');
    add('rect', { x: ml + 100, y: 6, width: 10, height: 10, fill: 'var(--gris)' }); add('text', { x: ml + 114, y: 15, 'font-size': 12, fill: 'var(--ink)' }, 'Disposición');
    return s;
  }

  // ---------------------------------------------------------------- clientes
  function nuevoCliente(extra) {
    const id = nid('g');
    gens[id] = Object.assign({ nombre: 'Cliente nuevo', cuit: '', direccion: '', lat: null, lon: null, rubro: '', contacto: '', estado: 'Prospecto', abono: null, cumpl: {}, residuos: [], retiros: [], notas: '' }, extra || {});
    actual = id; guardar('generadores', id); if (!extra) { tab = 'clientes'; pintar(); }
    return id;
  }
  function vClientes(v) {
    const cont = el('div', { class: 'cuerpo' });
    const aside = el('aside', { class: 'panel', 'aria-label': 'Clientes' });
    const buscar = el('input', { id: 'buscar', type: 'search', placeholder: 'Buscar cliente', 'aria-label': 'Buscar cliente' });
    const lista = el('div', { class: 'lista' });
    const pintarLista = () => {
      lista.textContent = '';
      const q = buscar.value.trim().toLowerCase();
      const ids = Object.keys(gens).filter(id => !q || (gens[id].nombre + ' ' + (gens[id].direccion || '')).toLowerCase().includes(q))
        .sort((a, b) => ESTADOS_C.indexOf(gens[b].estado) - ESTADOS_C.indexOf(gens[a].estado) || gens[a].nombre.localeCompare(gens[b].nombre));
      if (!ids.length) lista.appendChild(el('p', { class: 'ayuda', texto: 'Sin clientes todavía.' }));
      ids.forEach(id => { const g = gens[id]; lista.appendChild(el('button', { type: 'button', class: 'item', 'aria-current': String(id === actual), onclick: () => { actual = id; pintar(); } }, [el('span', { class: 'pt ' + g.estado }), el('strong', { texto: g.nombre }), el('span', { class: 'c', texto: g.estado + ' · ' + fmt(kgMes(g)) + ' kg/mes' })])); });
    };
    buscar.addEventListener('input', pintarLista);
    aside.append(el('div', { class: 'fila' }, [btn('+ Cliente', () => nuevoCliente(), 'pri'), Object.keys(gens).length ? null : btn('Ejemplos', cargarEjemplos)]), buscar, lista);
    pintarLista();
    const main = el('main', { class: 'panel' });
    cont.append(aside, main); v.appendChild(cont);
    const g = gens[actual];
    if (!g) { main.appendChild(el('p', { class: 'ayuda', texto: 'Elegí un cliente de la lista o creá uno nuevo.' })); return; }
    const id = actual, save = () => guardar('generadores', id);
    const rep = () => { save(); pintar(); };
    const conf_ = el('span', { class: 'confirma', hidden: true }, ['¿Borrar este cliente?', btn('Sí, borrar', () => { delete gens[id]; escribir('generadores', id); actual = null; pintar(); }, 'peligro'), btn('Cancelar', () => { conf_.hidden = true; })]);
    main.append(
      el('div', { class: 'fila', style: 'justify-content:space-between' }, [el('h2', { texto: g.nombre }), el('span', { class: 'chip', texto: g.estado })]),
      el('div', { class: 'campos' }, [
        campo('Empresa', txtIn('c-nom', g.nombre, x => { g.nombre = x || 'Cliente'; rep(); })),
        campo('Estado', selIn('c-est', g.estado, ESTADOS_C, x => { g.estado = x; rep(); })),
        campo('CUIT', txtIn('c-cuit', g.cuit, x => { g.cuit = x; save(); })),
        campo('Rubro', txtIn('c-rubro', g.rubro, x => { g.rubro = x; save(); }, 'Metalúrgica, alimenticia…')),
        campo('Dirección', txtIn('c-dir', g.direccion, x => { g.direccion = x; save(); })),
        campo('Coordenadas', txtIn('c-coord', g.lat != null ? g.lat + ', ' + g.lon : '', x => { const m = x.match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/); if (m) { g.lat = +m[1]; g.lon = +m[2]; } else { g.lat = null; g.lon = null; } save(); }, 'Pegá desde Google Maps: -34.66, -58.72')),
        campo('Contacto', txtIn('c-cont', g.contacto, x => { g.contacto = x; save(); }, 'Nombre y WhatsApp')),
        campo('Abono mensual ($)', numIn('c-abono', g.abono, x => { g.abono = x; save(); })),
      ]),
      el('div', { class: 'fila' }, [btn('Cotizar este cliente', () => { conf.coti = Object.assign(cotiBase(), conf.coti || {}, desdeCliente(g)); guardar('config', 'coti'); tab = 'cotizador'; pintar(); }), btn('Borrar cliente', () => { conf_.hidden = false; }, 'peligro'), conf_])
    );
    // cumplimiento
    const c = cumplimiento(g);
    const okN = c.filter(x => x.ok).length;
    main.append(el('div', { class: 'fila', style: 'justify-content:space-between' }, [el('h3', { texto: 'Cumplimiento' }), el('span', { class: 'chip', texto: okN + ' de ' + c.length })]),
      el('p', { class: 'ayuda', texto: 'Puntos de la Resolución 60/2026 de Ambiente (Provincia de Buenos Aires). Revisá el texto oficial y los plazos de la Resolución 181/2026 antes de prometer algo al cliente.' }));
    g.cumpl = g.cumpl || {};
    const ck = el('div', { class: 'check' });
    c.forEach(x => {
      let ctrl = null;
      if (x.edit === 'inscripto') ctrl = el('div', { class: 'fila' }, [el('input', { type: 'checkbox', id: 'k-ins', checked: g.cumpl.inscripto ? true : null, 'aria-label': 'Inscripto', onchange: e => { g.cumpl.inscripto = e.target.checked; rep(); } }), el('div', { style: 'width:120px' }, [txtIn('k-nro', g.cumpl.nroInscripcion, y => { g.cumpl.nroInscripcion = y; rep(); }, 'N°')])]);
      if (x.edit === 'ddjj') ctrl = el('div', { style: 'width:160px' }, [fechaIn('k-ddjj', g.cumpl.ddjj, y => { g.cumpl.ddjj = y; rep(); })]);
      if (x.edit === 'transp') ctrl = el('div', { style: 'min-width:160px' }, [selIn('k-tr', g.cumpl.transportista || '', [['', 'Elegir…']].concat(Object.entries(provs).filter(([, p]) => p.tipo === 'Transportista').map(([pid, p]) => [pid, p.nombre])), y => { g.cumpl.transportista = y; rep(); })]);
      ck.appendChild(el('div', { class: 'ck ' + (x.ok ? 'ok' : 'no') }, [el('span', { class: 'estado-ck', texto: x.ok ? '✓' : '✕' }), el('div', {}, [el('div', { class: 't', texto: x.t }), el('div', { class: 'd', texto: x.d })]), ctrl]));
    });
    main.appendChild(ck);
    // inventario
    main.append(el('h3', { texto: 'Inventario de residuos' }), el('p', { class: 'ayuda', texto: 'Cuánto genera por mes de cada tipo y a dónde va. En $/kg poné positivo si te lo pagan (valorización) y negativo si cuesta (disposición).' }));
    const ti = el('table');
    ti.appendChild(el('thead', {}, [el('tr', {}, ['Tipo', 'Detalle', 'Kg/mes', 'Destino', '$/kg', '$ por mes', ''].map((h, i) => el('th', { class: i >= 2 && i !== 3 ? 'r' : '', texto: h })))]));
    const tbi = el('tbody');
    (g.residuos || []).forEach((r, i) => tbi.appendChild(el('tr', {}, [
      el('td', {}, [selIn('r-t-' + i, r.tipo, TIPOS, y => { r.tipo = y; if (y === 'Mezcla no recuperable') r.destino = 'Disposición'; rep(); })]),
      el('td', {}, [txtIn('r-d-' + i, r.detalle, y => { r.detalle = y; save(); }, 'Ej.: cajas, film, viruta')]),

    const capital = (transporte + disposicion) * Math.max(0, c.diasCobro - c.diasPago) / 30;
    return { kgVal, kgDisp, transporte, disposicion, gestion, valorizacion, costo, abono, ebitda, margen: abono ? ebitda / abono : 0, capital };
  }
  function vCoti(v) {

    function calc() {

  async function archivo(nombre, data) { if (!descargas) { estado('Las descargas no están disponibles en esta vista'); return; } try { await descargas.save({ filename: nombre, data }); } catch (e) { /* cancelado */ } }
